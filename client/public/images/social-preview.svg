<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">coLearn-AI social preview</title>
  <desc id="desc">A branded coLearn-AI preview card with the AIED 2026 demo message, three product highlights, and a mock classroom workflow panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f5ed"/>
      <stop offset="55%" stop-color="#f3f0e5"/>
      <stop offset="100%" stop-color="#e8efe7"/>
    </linearGradient>
    <linearGradient id="forest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123524"/>
      <stop offset="100%" stop-color="#1f5b3b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f8f9b"/>
      <stop offset="100%" stop-color="#5ca9b2"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d89a38"/>
      <stop offset="100%" stop-color="#efc46d"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#dfe8de" stroke-width="1" opacity="0.35"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#123524" flood-opacity="0.16"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#123524" flood-opacity="0.11"/>
    </filter>
    <style>
      .title { font: 800 66px/1 Arial, Helvetica, sans-serif; letter-spacing: -0.03em; fill: #123524; }
      .title-accent { fill: #d89a38; }
      .subhead { font: 400 24px/1.45 Arial, Helvetica, sans-serif; fill: #48615a; }
      .body { font: 400 18px/1.5 Arial, Helvetica, sans-serif; fill: #123524; }
      .body-muted { font: 400 14px/1.5 Arial, Helvetica, sans-serif; fill: #50635c; }
      .eyebrow { font: 700 18px/1 Arial, Helvetica, sans-serif; fill: #123524; letter-spacing: 0.04em; text-transform: uppercase; }
      .mini-title { font: 800 20px/1.2 Arial, Helvetica, sans-serif; fill: #123524; }
      .mini-body { font: 400 14px/1.4 Arial, Helvetica, sans-serif; fill: #50635c; }
      .chip { font: 700 18px/1 Arial, Helvetica, sans-serif; fill: #13211d; }
      .panel-head { font: 800 21px/1.2 Arial, Helvetica, sans-serif; fill: #123524; }
      .panel-copy { font: 400 14px/1.4 Arial, Helvetica, sans-serif; fill: #50635c; }
      .trace-label { font: 800 15px/1 Arial, Helvetica, sans-serif; fill: #123524; letter-spacing: 0.04em; text-transform: uppercase; }
      .trace-key { font: 800 13px/1 Arial, Helvetica, sans-serif; fill: #123524; letter-spacing: 0.03em; text-transform: uppercase; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  <g transform="translate(38 38)">
    <g>
      <rect x="0" y="0" width="42" height="42" rx="12" fill="url(#forest)"/>
      <circle cx="15" cy="15" r="4.5" fill="#e8f0ea"/>
      <circle cx="27" cy="15" r="4.5" fill="#d89a38"/>
      <circle cx="21" cy="27" r="4.5" fill="#5ca9b2"/>
    </g>

    <text x="58" y="31" class="eyebrow">coLearn-AI</text>

    <g transform="translate(0 74)">
      <rect x="0" y="0" width="150" height="36" rx="18" fill="#e8f3ea" stroke="#c9ddd0"/>
      <circle cx="16" cy="18" r="6" fill="#d89a38"/>
      <text x="31" y="23" class="eyebrow" style="font-size:14px;">AIED 2026 demo</text>
    </g>

    <text x="0" y="194" class="title">
      <tspan x="0" dy="0">Collaborative learning</tspan>
      <tspan x="0" dy="66">with <tspan class="title-accent">AI scaffolding.</tspan></tspan>
    </text>

    <text x="0" y="338" class="subhead">
      <tspan x="0" dy="0">coLearn-AI keeps students working in groups, guides them with</tspan>
      <tspan x="0" dy="34">focused AI feedback, and preserves every revision in a visible</tspan>
      <tspan x="0" dy="34">learning trace.</tspan>
    </text>

    <g transform="translate(0 390)">
      <rect x="0" y="0" width="188" height="42" rx="21" fill="#ffffff" stroke="#d7e2d9"/>
      <text x="94" y="27" text-anchor="middle" class="chip">Small-group workflow</text>

      <rect x="202" y="0" width="228" height="42" rx="21" fill="#ffffff" stroke="#d7e2d9"/>
      <text x="316" y="27" text-anchor="middle" class="chip">AI feedback, not answers</text>

      <rect x="444" y="0" width="244" height="42" rx="21" fill="#ffffff" stroke="#d7e2d9"/>
      <text x="566" y="27" text-anchor="middle" class="chip">Persistent reasoning trace</text>
    </g>

    <g transform="translate(0 458)" filter="url(#softShadow)">
      <rect x="0" y="0" width="612" height="114" rx="22" fill="#ffffff"/>
      <rect x="0" y="0" width="6" height="114" rx="3" fill="url(#gold)"/>
      <text x="22" y="34" class="body" style="font-weight:700; font-size:18px;">
        Built for programming and CS classrooms.
      </text>
      <text x="22" y="62" class="body-muted">
        Students explain, revise, and collaborate instead of disappearing into a black box.
      </text>
    </g>
  </g>

  <g transform="translate(684 38)" filter="url(#shadow)">
    <rect x="0" y="0" width="478" height="554" rx="30" fill="url(#forest)"/>
    <rect x="18" y="18" width="442" height="518" rx="24" fill="#ffffff"/>

    <g transform="translate(18 18)">
      <rect x="0" y="0" width="442" height="46" rx="24" fill="#f2f5f3"/>
      <circle cx="22" cy="23" r="5.5" fill="#c9d2cc"/>
      <circle cx="40" cy="23" r="5.5" fill="#c9d2cc"/>
      <circle cx="58" cy="23" r="5.5" fill="#c9d2cc"/>

      <g transform="translate(18 66)">
        <rect x="0" y="0" width="406" height="110" rx="20" fill="#ffffff" stroke="#dce7df"/>
        <g transform="translate(18 18)">
          <rect x="0" y="0" width="118" height="42" rx="12" fill="url(#forest)"/>
          <text x="59" y="27" text-anchor="middle" style="font: 800 18px Arial, Helvetica, sans-serif; fill: #ffffff;">coLearn-AI</text>
          <text x="138" y="16" class="panel-head">A classroom platform</text>
          <text x="138" y="40" class="panel-copy">with visible thinking, guided collaboration, and AI support.</text>
          <text x="138" y="63" class="panel-copy">Built for the AIED 2026 demo and for real courses after the demo.</text>
        </g>
      </g>

      <g transform="translate(18 190)">
        <rect x="0" y="0" width="191" height="122" rx="18" fill="#fbfcfb" stroke="#dbe6df"/>
        <rect x="209" y="0" width="191" height="122" rx="18" fill="#fbfcfb" stroke="#dbe6df"/>
        <rect x="0" y="136" width="191" height="122" rx="18" fill="#fbfcfb" stroke="#dbe6df"/>
        <rect x="209" y="136" width="191" height="122" rx="18" fill="#fbfcfb" stroke="#dbe6df"/>

        <text x="18" y="32" class="mini-title">Student view</text>
        <text x="18" y="56" class="mini-body">Work with teammates, answer prompts, and revise as you learn.</text>

        <text x="227" y="32" class="mini-title">Creator view</text>
        <text x="227" y="56" class="mini-body">Set up an activity, test the flow, and adjust the scaffolding.</text>

        <text x="18" y="168" class="mini-title">Instructor view</text>
        <text x="18" y="192" class="mini-body">Monitor group progress, guide discussion, and demonstrate the activity.</text>

        <text x="227" y="168" class="mini-title">Learning trace</text>
        <text x="227" y="192" class="mini-body">Every revision stays visible so reasoning is easier to follow.</text>
      </g>

      <g transform="translate(18 462)">
        <rect x="0" y="0" width="406" height="58" rx="16" fill="url(#bg)" stroke="#dbe6df"/>
        <text x="18" y="24" class="trace-label">Learning trace</text>
        <g transform="translate(126 14)">
          <text x="0" y="13" class="trace-key">Discuss</text>
          <rect x="68" y="3" width="200" height="12" rx="6" fill="#e6efe8"/>
          <rect x="68" y="3" width="154" height="12" rx="6" fill="url(#forest)"/>

          <text x="0" y="33" class="trace-key">Revise</text>
          <rect x="68" y="23" width="200" height="12" rx="6" fill="#e6efe8"/>
          <rect x="68" y="23" width="122" height="12" rx="6" fill="url(#teal)"/>
        </g>
      </g>
    </g>
  </g>
</svg>
